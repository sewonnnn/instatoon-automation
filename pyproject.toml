[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "instatoon-tools"
version = "0.1.0"
description = "Local state and Korean lettering tools for agent-driven comics"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "fonttools>=4.55,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
instatoon = "tools.instatoon.__main__:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
